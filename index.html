<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Z.E Family AI Scanner</title>

<style>
body {
    font-family: Arial;
    background: linear-gradient(135deg, #e6f2ff, #f0f8ff);
    margin: 0;
    padding: 0;
}

.container {
    max-width: 800px;
    margin: auto;
    padding: 20px;
}

.brand {
    position: absolute;
    top: 15px;
    right: 20px;
    font-weight: bold;
    color: #4a6fa5;
}

.card {
    background: white;
    padding: 20px;
    border-radius: 15px;
    margin-bottom: 20px;
    box-shadow: 0 5px 15px rgba(0,0,0,0.05);
}

input, select {
    width: 100%;
    padding: 12px;
    margin-top: 10px;
    border-radius: 10px;
    border: 1px solid #ccc;
}

button {
    margin-top: 15px;
    padding: 12px;
    border-radius: 10px;
    border: none;
    background: #5fa8d3;
    color: white;
    cursor: pointer;
}

button:hover {
    opacity: 0.9;
}

.pricing-grid {
    display: grid;
    gap: 15px;
}

.plan {
    border: 2px solid #d6e6ff;
    padding: 15px;
    border-radius: 12px;
}

.error {
    color: red;
}

.success {
    color: green;
}
</style>
</head>

<body>

<div class="brand">Z.E Family</div>

<div class="container">

<h2>AI Code Scanner</h2>

<div class="card">
    <input id="repo" placeholder="GitHub repo URL">
    <button onclick="scanRepo()">Scan GitHub Repo</button>
</div>

<div class="card">
    <h3>Upgrade to Pro</h3>
    <input id="email" placeholder="Your email">

    <div class="pricing-grid">

        <div class="plan">
            <h4>Week</h4>
            <p>$5</p>
            <button onclick="startCheckout('week')">Выбрать Week</button>
        </div>

        <div class="plan">
            <h4>Month</h4>
            <p>$15</p>
            <button onclick="startCheckout('month')">Выбрать Month</button>
        </div>

        <div class="plan">
            <h4>6 Months</h4>
            <p>$60</p>
            <button onclick="startCheckout('6months')">Выбрать 6 Months</button>
        </div>

    </div>
</div>

<div class="card">
    <h3>Result</h3>
    <pre id="result"></pre>
</div>

<div id="error" class="error"></div>

</div>

<script>
async function scanRepo() {
    const repo = document.getElementById("repo").value;

    document.getElementById("result").innerText = "Scanning...";

    try {
        const res = await fetch("/scan", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({repo_url: repo})
        });

        const data = await res.json();
        document.getElementById("result").innerText = JSON.stringify(data, null, 2);

    } catch (e) {
        document.getElementById("error").innerText = e;
    }
}

async function startCheckout(plan) {
    const email = document.getElementById("email").value;

    if (!email) {
        alert("Введите email");
        return;
    }

    try {
        const res = await fetch("/create-checkout-session", {
            method: "POST",
            headers: {"Content-Type": "application/json"},
            body: JSON.stringify({plan, email})
        });

        const data = await res.json();

        if (data.url) {
            window.location.href = data.url;
        } else {
            alert("Ошибка оплаты");
        }

    } catch (e) {
        alert("Ошибка: " + e);
    }
}
</script>

</body>
</html>
